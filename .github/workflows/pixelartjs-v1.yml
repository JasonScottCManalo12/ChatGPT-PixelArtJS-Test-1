name: PixelArtJS V1 checks

on:
  push:
    branches:
      - pixelartjs-new-ui-v1
      - feature/v1-export-fixture-verification
  pull_request:
    branches:
      - pixelartjs-new-ui-v1

permissions:
  contents: read

jobs:
  v1-tests:
    name: V1 sequence and export fixture checks (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run V1 sequence and export fixture tests
        run: node --test pixelartjs-new-ui-v1/tests/sequence.test.js pixelartjs-new-ui-v1/tests/export-fixtures.test.js
